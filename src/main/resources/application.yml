spring:
  application.name: tech-support-ticket-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ticketdb
    username: ticketuser
    password: ticketpass
  jpa:
    hibernate.ddl-auto: update
    show-sql: true
  properties:
    hibernate:
      format_sql: true
    sql:
      init:
        mode: never
    logging:
      level:
        org.springframework.security: WARN
  security:
    password:
      pepper: ${PASSWORD_PEPPER:test-pepper}

management:
  endpoints:
    web:
      exposure:
        include: health,info,shutdown
  endpoint:
    health:
      show-details: when-authorized
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true

info:
  app:
    name: tech-support-ticket-service
    description: Internal IT ticketing system



