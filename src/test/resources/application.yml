spring:
  datasource:
    url: jdbc:h2:mem:ticket_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa.hibernate.ddl-auto: create-drop

  properties:
    hibernate:
      format_sql: true

    sql:
      init:
        mode: never

  logging:
    level:
      org.springframework.security: WARN

security:
    password:
      pepper: ${PASSWORD_PEPPER:test-pepper}